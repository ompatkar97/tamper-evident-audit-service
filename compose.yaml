services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditdb
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audit-change-me}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U audit -d auditdb"], interval: 5s, timeout: 3s, retries: 10}
  audit-service:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auditdb
      DB_USER: audit
      DB_PASSWORD: ${DB_PASSWORD:-audit-change-me}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-local-development-key-change-me}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
